<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bureau Garnier Rénovation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Mise en page : logiciel de gestion (menu latéral, barre du haut, zone de travail) au thème Aevio de la MIA : bleu Aevio, Plus Jakarta Sans, noir profond en sombre. */
:root{
  --bg:#F5F7FB; --surface:#FFFFFF; --surface-2:#F5F7FB; --ink:#111A37; --muted:#5B6B85; --line:#E9ECF3;
  --accent:#2F62FF; --accent-ink:#FFFFFF; --accent-soft:#EAF0FF; --accent-2:#2350E6;
  --ok:#1FA463; --ok-soft:rgba(31,164,99,.12); --warn:#A87800; --warn-soft:#FBF1D9; --bad:#C0392B; --bad-soft:rgba(192,57,43,.1); --info:#2350E6; --info-soft:#EAF0FF;
  --toast-bg:#111A37; --toast-fg:#FFFFFF; --bar:#D6E1FF;
  --shadow:0 1px 2px rgba(17,26,55,.04);
  --grad:linear-gradient(180deg,#3A6BFF,#2350E6);
  --f-ui:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#121212; --surface-2:#1C1C1E; --ink:#F2F2F2; --muted:#9A9AA3; --line:#2A2A2E;
  --accent:#4F7CFF; --accent-ink:#FFFFFF; --accent-soft:#1A2340; --accent-2:#8FAAFF;
  --ok:#3FCB86; --ok-soft:rgba(63,203,134,.16); --warn:#F0C04E; --warn-soft:#33290F; --bad:#F0776A; --bad-soft:rgba(240,119,106,.16); --info:#8FAAFF; --info-soft:#1A2340;
  --toast-bg:#F2F2F2; --toast-fg:#000000; --bar:#243259;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#121212; --surface-2:#1C1C1E; --ink:#F2F2F2; --muted:#9A9AA3; --line:#2A2A2E;
  --accent:#4F7CFF; --accent-ink:#FFFFFF; --accent-soft:#1A2340; --accent-2:#8FAAFF;
  --ok:#3FCB86; --ok-soft:rgba(63,203,134,.16); --warn:#F0C04E; --warn-soft:#33290F; --bad:#F0776A; --bad-soft:rgba(240,119,106,.16); --info:#8FAAFF; --info-soft:#1A2340;
  --toast-bg:#F2F2F2; --toast-fg:#000000; --bar:#243259;
  --shadow:none; color-scheme:dark}

/* Style neutre (« à vos couleurs ») : vert sapin, Figtree, angles plus droits. Activé par le bouton Style. */
:root[data-skin="neutre"]{
  --bg:#F3F4F1; --surface:#FFFFFF; --surface-2:#EDF0EC; --ink:#18221F; --muted:#5D6A65; --line:#DCE2DD;
  --accent:#1F6B57; --accent-soft:#E2EFEA; --accent-2:#174F41; --grad:#1F6B57; --bar:#D3E6DE;
  --ok:#2C7D52; --ok-soft:#E3F2E9; --warn:#9A6412; --warn-soft:#FBF0DC; --bad:#B63A33; --bad-soft:#FBE6E4; --info:#3A5BA8; --info-soft:#E6ECF8;
  --toast-bg:#18221F; --toast-fg:#FFFFFF; --shadow:0 1px 2px rgba(24,34,31,.06),0 4px 16px rgba(24,34,31,.05);
  --f-ui:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --r:12px}
@media (prefers-color-scheme:dark){:root[data-skin="neutre"]:not([data-theme="light"]){
  --bg:#0F1412; --surface:#171E1B; --surface-2:#1F2824; --ink:#E6EDE9; --muted:#9AA9A2; --line:#2A3631;
  --accent:#3E9C80; --accent-soft:#1C3A30; --accent-2:#86D3B9; --grad:#2F8A6F; --bar:#24433A;
  --ok:#66C792; --ok-soft:#183427; --warn:#E3AC4E; --warn-soft:#3A2D14; --bad:#EE7C73; --bad-soft:#3D1D1A; --info:#8EA8EC; --info-soft:#1D2742;
  --toast-bg:#E6EDE9; --toast-fg:#0F1412; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-skin="neutre"][data-theme="dark"]{
  --bg:#0F1412; --surface:#171E1B; --surface-2:#1F2824; --ink:#E6EDE9; --muted:#9AA9A2; --line:#2A3631;
  --accent:#3E9C80; --accent-soft:#1C3A30; --accent-2:#86D3B9; --grad:#2F8A6F; --bar:#24433A;
  --ok:#66C792; --ok-soft:#183427; --warn:#E3AC4E; --warn-soft:#3A2D14; --bad:#EE7C73; --bad-soft:#3D1D1A; --info:#8EA8EC; --info-soft:#1D2742;
  --toast-bg:#E6EDE9; --toast-fg:#0F1412; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}
:root[data-skin="neutre"] .btn{border-radius:9px;border-width:1px;font-weight:600}
:root[data-skin="neutre"] .btn.primary{box-shadow:none;font-weight:700}
:root[data-skin="neutre"] .nav button,:root[data-skin="neutre"] .theme-btn{border-radius:9px;font-weight:600}
:root[data-skin="neutre"] .nav button:not([aria-current]){color:var(--muted)}
:root[data-skin="neutre"] .logo{border-radius:9px}
:root[data-skin="neutre"] .seg{border-radius:9px}
:root[data-skin="neutre"] .seg button{border-radius:7px}
:root[data-skin="neutre"] .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
:root[data-skin="neutre"] .why{border-left-width:1px}
:root[data-skin="neutre"] .toast{border-radius:10px}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}

.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100%}
/* Menu latéral */
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;height:100dvh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--grad);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.brand b{display:block;font-size:14.5px;line-height:1.2;font-weight:800;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;height:44px;border:0;background:none;padding:0 14px;border-radius:12px;color:var(--ink);font-weight:700;text-align:left}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-2)}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;background:var(--accent-soft);color:var(--accent-2);font-size:11px;font-weight:800;border-radius:20px;padding:1px 8px;min-width:22px;text-align:center}
.nav .count.warn{background:var(--bad)}
.side .sep{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 10px;margin-top:4px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.connect{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--muted)}
.connect b{color:var(--ink);font-weight:600;display:block;margin-bottom:4px}
.dots{display:flex;flex-wrap:wrap;gap:5px 10px}
.dots span{display:inline-flex;align-items:center;gap:5px}
.dots span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.user{display:flex;align-items:center;gap:10px;padding:6px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:12.5px;color:var(--accent-2);flex:none}
.user b{display:block;font-size:13.5px}.user span{font-size:12px;color:var(--muted)}

/* Zone principale */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top h1{font-size:20px;font-weight:800;letter-spacing:-.02em}
.top .sub{font-size:12.5px;color:var(--muted)}
.top .grow{flex:1;min-width:0}
.pill-demo{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:4px 10px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 15px;font-weight:700;white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;font-weight:800;box-shadow:0 8px 22px rgba(47,98,255,.38),0 2px 6px rgba(35,80,230,.25)}
.btn.primary:hover{filter:brightness(1.06)}.btn.primary:active{transform:translateY(1px)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn svg{width:16px;height:16px}
.btn.sm{padding:6px 10px;font-size:13px}
.content{padding-block:24px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1280px;width:100%}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:15px;font-weight:800;letter-spacing:-.01em}
.card-h .grow{flex:1}
.card-b{padding:16px 18px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
button.kpi:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.kpi .lbl{font-size:12.5px;font-weight:600;color:var(--muted)}
.kpi .val{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi .det{font-size:12.5px;color:var(--muted)}
.kpi .det b{font-weight:600}
.up{color:var(--ok)}

.grid-2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;border-radius:999px;padding:4px 11px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-ok{color:var(--ok);background:var(--ok-soft)}
.c-warn{color:var(--warn);background:var(--warn-soft)}
.c-bad{color:var(--bad);background:var(--bad-soft)}
.c-info{color:var(--info);background:var(--info-soft)}
.c-acc{color:var(--accent-2);background:var(--accent-soft)}
.c-mut{color:var(--muted);background:var(--surface-2)}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row .ic{width:36px;height:36px;border-radius:11px;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;flex:none}
.row .ic svg{width:17px;height:17px}
.row .txt{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:700;white-space:nowrap}
button.row{width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;font:inherit}
button.row:hover{background:var(--surface-2)}

.timeline{display:flex;flex-direction:column;gap:0;padding:6px 18px 14px}
.tl{display:grid;grid-template-columns:54px 14px minmax(0,1fr);gap:10px;padding:8px 0;position:relative}
.tl .h{font-size:12.5px;color:var(--muted);padding-top:1px}
.tl .d{width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:5px;box-shadow:0 0 0 3px var(--accent-soft)}
.tl .x b{font-weight:600}
.tl .x span{display:block;font-size:12.5px;color:var(--muted)}

/* Graphique */
.chart{padding:8px 18px 16px}
.chart svg{width:100%;height:auto;display:block}

/* À valider */
.queue{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.25fr);gap:20px;align-items:start}
.qi{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:3px solid transparent;border-top:0;border-right:0;text-align:left}
.qi:hover{background:var(--surface-2)}
.qi[aria-selected="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.qi .txt{flex:1;min-width:0}
.qi .t{font-weight:600}
.qi .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.qi .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.detail .card-b{display:flex;flex-direction:column;gap:14px}
.field{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;font-size:13.5px}
.field dt{color:var(--muted)}
.field dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.draft{width:100%;min-height:190px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface-2);line-height:1.55}
.draft:focus{outline:2px solid var(--accent);outline-offset:0;background:var(--surface)}
.why{background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:12px 14px;font-size:13px}
.why b{display:block;margin-bottom:6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.why ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* Devis */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col-h{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:13.5px;padding:2px 4px}
.col-h span{font-weight:600;color:var(--muted);font-size:12.5px}
.dv{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.dv .top-l{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dv .who{font-weight:700}
.dv .what{font-size:13px;color:var(--muted)}
.dv .bot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px}

/* Tableaux */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:720px}
th{text-align:left;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:10px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 18px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}

/* Automatisations */
.autos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.au{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.au-h{display:flex;gap:12px;align-items:flex-start}
.au-h .ic{width:36px;height:36px;border-radius:11px;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;flex:none}
.au-h .ic svg{width:18px;height:18px}
.au-h b{display:block}
.au-h span{font-size:12.5px;color:var(--muted)}
.au .stat{font-size:12.5px;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--grad);color:#fff}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.legend .card{padding:14px 16px}
.legend b{display:block;margin-bottom:3px}
.legend p{margin:0;font-size:13px;color:var(--muted)}

/* Assistant */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:30;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.12);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer-h b{flex:1}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.ai ul{margin:6px 0 0;padding-left:18px}
.notice{font-size:12px;color:var(--muted);text-align:center;padding:0 16px 6px}
.sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.sugg button{border:1px solid var(--line);background:var(--surface);color:var(--accent-2);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700}
.sugg button:hover{background:var(--accent-soft)}
.ask{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.ask input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2)}
.scrim{position:fixed;inset:0;background:rgba(10,15,13,.35);z-index:25}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-fg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:40;display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px)}
.toast svg{width:16px;height:16px;color:var(--ok)}

.tabs-m{display:none}
.theme-btn{display:flex;align-items:center;gap:12px;width:100%;height:44px;padding:0 14px;border:0;border-radius:12px;background:none;color:var(--ink);font-weight:700;text-align:left}
.theme-btn:hover{background:var(--surface-2)}
.theme-btn svg{width:18px;height:18px;flex:none}
.theme-btn .sun,.theme-btn .l-sun{display:none}
:root[data-theme="dark"] .theme-btn .moon,:root[data-theme="dark"] .theme-btn .l-moon{display:none}
:root[data-theme="dark"] .theme-btn .sun,:root[data-theme="dark"] .theme-btn .l-sun{display:inline}

journal(){

function chart(){
  const W=560,H=200,p={l:34,r:12,t:14,b:28}, max=10, n=S.hours.length, bw=(W-p.l-p.r)/n;
  const y=v=>p.t+(H-p.t-p.b)*(1-v/max);
  let g='';
  [0,5,10].forEach(v=>{g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${p.l-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v} h</text>`});
  S.hours.forEach((v,i)=>{const x=p.l+i*bw+bw*.2,w=bw*.6,last=i===n-1;
    g+=`<rect class="bar" x="${x}" y="${y(v)}" width="${w}" height="${y(0)-y(v)}" rx="4" fill="${last?'var(--accent)':'var(--bar)'}"/>`;
    g+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${S.weeks[i]}</text>`;
    if(last) g+=`<text x="${x+w/2}" y="${y(v)-6}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${String(v).replace('.',',')} h</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Heures rendues par semaine, de 3,5 h à 8 h">${g}</svg>`;
}

function log(who,t,c){ const d=new Date(); S.journal.unshift({h:d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}), who, t, c}); }
function resolve(q, who, msg, c){
  S.queue = S.queue.filter(x=>x!==q); S.validated++;
  log(who, `${q.type} · ${q.title}`, c);
  toast(msg + (who.includes('corrections') ? ', avec vos corrections' : ''));
  const card = $('.detail');
  if (G && !REDUCED && card){ G.to(card,{opacity:0,x:16,duration:.2,onComplete:()=>{renderNav();RENDER.queue();G.from('.detail',{opacity:0,y:8,duration:.25,clearProps:'all'})}}) }
  else { renderNav(); RENDER.queue(); }
}

let tt;
function toast(m){
  const t=$('#toast'); t.innerHTML=svg('check')+m; t.hidden=false; clearTimeout(tt);
  if (G && !REDUCED) G.fromTo(t,{y:12,opacity:0},{y:0,opacity:1,duration:.25});
  tt=setTimeout(()=>{ if(G&&!REDUCED) G.to(t,{opacity:0,duration:.2,onComplete:()=>t.hidden=true}); else t.hidden=true; },2600);
}

/* ---------- Assistant ---------- */
const QA = [
  {q:'Quels devis attendent une réponse ?', a:()=>`Quatre devis attendent une réponse, pour ${eur(24850)} HT :<ul><li>Rossi, isolation des combles : 9 400 €, J+8. Une relance est prête dans « À valider ».</li><li>Cabinet Arnaud, cloisons : 7 950 €, J+5.</li><li>Martin, fenêtres : 4 320 €, J+3.</li><li>Dupuis, peinture : 3 180 €, 2ᵉ relance envoyée mardi.</li></ul>`},

  {q:'Prépare la relance de M. Faure', a:()=>`C'est le 3ᵉ palier : je vous conseille un appel plutôt qu'un mail. Voici quoi dire :<ul><li>Facture F-2026-081, salle de bain, 2 720 € TTC, échue le 23 septembre.</li><li>Deux rappels sans réponse (2 et 13 octobre).</li><li>Proposer un paiement en deux fois si besoin.</li></ul>Je peux aussi préparer une mise en demeure, à valider avant envoi.`},
];
function msg(cls, html){ const m=document.createElement('div'); m.className='msg '+cls; m.innerHTML=html; $('#msgs').appendChild(m); $('#msgs').scrollTop=1e6; if(G&&!REDUCED) G.from(m,{y:8,opacity:0,duration:.25}); }
function ask(text){
  msg('me', text.replace(/</g,'&lt;'));
  const hit = QA.find(x=>x.q.toLowerCase()===text.trim().toLowerCase());
  setTimeout(()=>msg('ai', hit ? hit.a() : 'Dans cette démonstration, je réponds aux trois questions proposées ci-dessous. Dans le vrai outil, je cherche dans vos mails, vos devis, vos factures et votre planning.'), 450);
}
function openAI(){ $('#drawer').hidden=false; $('#scrim').hidden=false; if(G&&!REDUCED) G.from('#drawer',{x:40,opacity:0,duration:.3,ease:'power2.out'}); setTimeout(()=>$('#ask-in').focus(),50); }
function closeAI(){ $('#drawer').hidden=true; $('#scrim').hidden=true; }
$('#open-ai').addEventListener('click',openAI); $('#close-ai').addEventListener('click',closeAI); $('#scrim').addEventListener('click',closeAI);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeAI(); });
$('#sugg').innerHTML = QA.map((x,i)=>`<button type="button" data-qa="${i}">${x.q}</button>`).join('');
$('#sugg').addEventListener('click',e=>{ const b=e.target.closest('[data-qa]'); if(b) ask(QA[+b.dataset.qa].q); });
$('#ask').addEventListener('submit',e=>{ e.preventDefault(); const v=$('#ask-in').value.trim(); if(v){ ask(v); $('#ask-in').value=''; } });
msg('ai','Bonjour Marc. Six éléments vous attendent dans « À valider », et la facture de M. Faure mérite un appel aujourd\'hui. Que puis-je faire pour vous ?');

/* ---------- Mode clair / sombre (comme la MIA) ---------- */
const root=document.documentElement;
try{ const t=localStorage.getItem('gr-theme'); if(t==='dark'||t==='light') root.setAttribute('data-theme',t); }catch(_){}
document.querySelectorAll('[data-theme-btn]').forEach(b=>b.addEventListener('click',()=>{
  const dark = root.getAttribute('data-theme') ? root.getAttribute('data-theme')==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;

/* ---------- Style Aevio / neutre (pour montrer que l'outil prend les couleurs du client) ---------- */
function setSkin(k, say){
  if (k==='neutre') root.setAttribute('data-skin','neutre'); else root.removeAttribute('data-skin');

  if (say) toast(k==='neutre' ? 'Style neutre : l\'outil prend les couleurs de votre entreprise' : 'Style Aevio');
}
try{ if(localStorage.getItem('gr-skin')==='neutre') setSkin('neutre'); }catch(_){}
document.querySelectorAll('[data-skin-btn]').forEach(b=>b.addEventListener('click',()=>{
  const k = root.getAttribute('data-skin')==='neutre' ? 'aevio' : 'neutre';
  setSkin(k,true);
  if (G && !REDUCED) G.fromTo('.app',{opacity:.4},{opacity:1,duration:.35,ease:'power1.out',clearProps:'opacity'});
